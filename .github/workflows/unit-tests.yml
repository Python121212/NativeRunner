name: Unit tests

# JVM unit tests (JUnit + Robolectric) for the launch guards, the content importer and the GPU
# rules. This is the check that needs no device: it runs the same code the phone runs, on the
# Android framework implementation Robolectric ships.
#
# It exists because `Pull Request build check` only listens on `master`, so the tests never ran for
# the work on `main`.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "どの flavor のテストを走らせるか"
        type: choice
        options:
          - legacy
          - modern
          - both
        default: legacy
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        variant: [Legacy, Modern]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: unit tests (${{ matrix.variant }})

    steps:
      - uses: actions/checkout@v4

      - name: Skip flavors that were not asked for
        id: want
        env:
          CHOICE: ${{ inputs.variant || 'both' }}
          VARIANT: ${{ matrix.variant }}
        run: |
          want="true"
          case "$CHOICE" in
            legacy) [ "$VARIANT" = "Legacy" ] || want="false" ;;
            modern) [ "$VARIANT" = "Modern" ] || want="false" ;;
          esac
          echo "run=$want" >> "$GITHUB_OUTPUT"

      - name: Restore large binary assets (assets / jniLibs / bundletool)
        if: steps.want.outputs.run == 'true'
        run: scripts/fetch-large-assets.sh

      - uses: actions/setup-java@v4
        if: steps.want.outputs.run == 'true'
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.want.outputs.run == 'true'

      # Robolectric fetches its android-all jars from Maven during the test run; a failed download
      # fails every Robolectric test, so keep them cached between runs.
      - name: Cache Robolectric android-all jars
        if: steps.want.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      # Only non-empty values are written: the secrets plugin turns every local.properties entry
      # into a BuildConfig field, and an empty value emits `= ;`, which does not compile.
      - name: Inject dummy build credentials
        if: steps.want.outputs.run == 'true'
        run: |
          : > local.properties
          echo "POSTHOG_API_KEY=dummy" >> local.properties
          echo "POSTHOG_HOST=https://us.i.posthog.com" >> local.properties

      - name: Run unit tests (${{ matrix.variant }})
        id: tests
        if: steps.want.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:test${{ matrix.variant }}DebugUnitTest --console=plain \
            2>&1 | tee /tmp/gradle-test.log

      - name: Summarise results
        if: always() && steps.want.outputs.run == 'true'
        run: |
          set +e
          python3 - <<'PY' > /tmp/test-summary.md 2>/dev/null || true
          import glob, xml.etree.ElementTree as ET
          rows, total, failed, skipped = [], 0, 0, 0
          for f in glob.glob("app/build/test-results/**/TEST-*.xml", recursive=True):
              root = ET.parse(f).getroot()
              for case in root.iter("testcase"):
                  total += 1
                  bad = case.find("failure") is not None or case.find("error") is not None
                  if case.find("skipped") is not None:
                      skipped += 1
                  if bad:
                      failed += 1
                      msg = (case.find("failure") if case.find("failure") is not None
                             else case.find("error")).get("message") or ""
                      rows.append(f"| {case.get('classname')} | {case.get('name')} | {msg.splitlines()[0][:160] if msg else ''} |")
          print(f"### Unit tests: {total - failed - skipped}/{total - skipped} passed, {failed} failed, {skipped} skipped\n")
          if rows:
              print("| class | test | message |")
              print("|---|---|---|")
              print("\n".join(rows))
          PY
          cat /tmp/test-summary.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          # A run without any result file means the task never produced tests: fail loudly.
          ls app/build/test-results/**/TEST-*.xml >/dev/null 2>&1 || echo "::error::no test results were produced"
          exit 0

      # Artifact and log downloads redirect to hosts automation cannot always reach, so the log
      # and the failing assertions are mirrored into the `ci-logs` branch and a check annotation.
      # Every command ends with `|| true`: a logging problem must never fail a passing test run.
      - name: Publish test log
        if: always() && steps.want.outputs.run == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set +e
          LOG=".ci-logs/unit-tests-${RUN_ID}-${VARIANT}.log"
          mkdir -p .ci-logs
          {
            echo "=== summary ==="
            cat /tmp/test-summary.md 2>/dev/null || true
            echo "=== gradle log (tail) ==="
            tail -c 1500000 /tmp/gradle-test.log 2>/dev/null || true
          } > "$LOG" 2>&1 || true

          # Kotlin compile errors are the one failure the generic "What went wrong" excerpt hides,
          # and they are the only thing an operator can act on without downloading the log.
          COMPILE="$(grep -E "^e: " /tmp/gradle-test.log 2>/dev/null | head -20)"
          if [ -n "$COMPILE" ]; then
            ESCAPED="$(printf '%s\n' "$COMPILE" | head -c 3000 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=compile-errors-${VARIANT}-${RUN_ID}::$ESCAPED"
          fi

          EXCERPT="$(awk '/What went wrong/{f=1} f' /tmp/gradle-test.log 2>/dev/null | head -40)"
          if [ -z "$EXCERPT" ]; then
            EXCERPT="$(grep -h -m20 -A4 'failure message' /tmp/test-summary.md 2>/dev/null | head -40)"
          fi
          if [ -n "$EXCERPT" ] && ! echo "$EXCERPT" | grep -q '^BUILD SUCCESSFUL'; then
            ESCAPED="$(printf '%s\n' "$EXCERPT" | head -c 3000 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::warning title=unit-tests-${VARIANT}-${RUN_ID}::$ESCAPED"
          fi

          git config user.name "ci-bot" || true
          git config user.email "ci-bot@users.noreply.github.com" || true
          git add -f "$LOG" || true
          git commit -m "ci: unit test log for run ${RUN_ID} (${VARIANT})" || true
          # Both variants push to the same branch from different runners. A plain retry loses the
          # other job's log, so re-read the branch and re-apply this file on top of it before each
          # attempt; the last attempt keeps whatever arrived in the meantime.
          pushed="false"
          for attempt in 1 2 3; do
            if git push --force origin "HEAD:refs/heads/ci-logs" > /tmp/push.log 2>&1; then
              pushed="true"
              break
            fi
            sleep "$((attempt * 5))"
            git fetch --depth=1 origin ci-logs || true
            git reset --soft FETCH_HEAD 2>/dev/null || true
            git checkout FETCH_HEAD -- . 2>/dev/null || true
            git add -f "$LOG" || true
            git commit -m "ci: unit test log for run ${RUN_ID} (${VARIANT})" || true
          done
          if [ "$pushed" = "true" ]; then
            echo "log pushed to ci-logs"
          else
            echo "log push failed:"; tail -5 /tmp/push.log || true
          fi
          exit 0

      - name: Fail when tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "unit tests (${{ matrix.variant }}) failed"
          exit 1

      - name: Upload test reports
        if: always() && steps.want.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.variant }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
          retention-days: 7
          if-no-files-found: warn

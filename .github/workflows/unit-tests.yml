name: Unit tests

# JVM unit tests (JUnit + Robolectric) for the launch guards, the content importer and the GPU
# rules. This is the check that needs no device: it runs the same code the phone runs, on the
# Android framework implementation Robolectric ships.
#
# It exists because `Pull Request build check` only listens on `master`, so the tests never ran for
# the work on `main`.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "どの flavor のテストを走らせるか"
        type: choice
        options:
          - legacy
          - modern
          - both
        default: legacy
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        variant: [Legacy, Modern]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: unit tests (${{ matrix.variant }})

    steps:
      - uses: actions/checkout@v4

      - name: Skip flavors that were not asked for
        id: want
        env:
          CHOICE: ${{ inputs.variant || 'both' }}
          VARIANT: ${{ matrix.variant }}
        run: |
          want="true"
          case "$CHOICE" in
            legacy) [ "$VARIANT" = "Legacy" ] || want="false" ;;
            modern) [ "$VARIANT" = "Modern" ] || want="false" ;;
          esac
          echo "run=$want" >> "$GITHUB_OUTPUT"

      - name: Restore large binary assets (assets / jniLibs / bundletool)
        if: steps.want.outputs.run == 'true'
        run: scripts/fetch-large-assets.sh

      - uses: actions/setup-java@v4
        if: steps.want.outputs.run == 'true'
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.want.outputs.run == 'true'

      # Robolectric fetches its android-all jars from Maven during the test run; a failed download
      # fails every Robolectric test, so keep them cached between runs.
      - name: Cache Robolectric android-all jars
        if: steps.want.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      # Only non-empty values are written: the secrets plugin turns every local.properties entry
      # into a BuildConfig field, and an empty value emits `= ;`, which does not compile.
      - name: Inject dummy build credentials
        if: steps.want.outputs.run == 'true'
        run: |
          : > local.properties
          echo "POSTHOG_API_KEY=dummy" >> local.properties
          echo "POSTHOG_HOST=https://us.i.posthog.com" >> local.properties

      - name: Run unit tests (${{ matrix.variant }})
        if: steps.want.outputs.run == 'true'
        run: ./gradlew :app:test${{ matrix.variant }}DebugUnitTest --console=plain

      - name: Summarise results
        if: always() && steps.want.outputs.run == 'true'
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          rows, total, failed, skipped = [], 0, 0, 0
          for f in glob.glob("app/build/test-results/**/TEST-*.xml", recursive=True):
              root = ET.parse(f).getroot()
              for case in root.iter("testcase"):
                  total += 1
                  bad = case.find("failure") is not None or case.find("error") is not None
                  if case.find("skipped") is not None:
                      skipped += 1
                  if bad:
                      failed += 1
                      msg = (case.find("failure") if case.find("failure") is not None
                             else case.find("error")).get("message") or ""
                      rows.append(f"| {case.get('classname')} | {case.get('name')} | {msg.splitlines()[0][:160] if msg else ''} |")
          print(f"### Unit tests: {total - failed - skipped}/{total - skipped} passed, {failed} failed, {skipped} skipped\n")
          if rows:
              print("| class | test | message |")
              print("|---|---|---|")
              print("\n".join(rows))
          PY
          # A run without any result file means the task never produced tests: fail loudly.
          ls app/build/test-results/**/TEST-*.xml >/dev/null 2>&1 || echo "::error::no test results were produced"

      - name: Upload test reports
        if: always() && steps.want.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.variant }}
          path: |
            app/build/test-results/
            app/build/reports/tests/
          retention-days: 7
          if-no-files-found: warn

name: Build Release APK

# Produces release-signed APKs and attaches them to a GitHub release.
#
# Signing key: ci/release/release-keystore.p12 (see ci/release/README.md).
# If the KEYSTORE_BASE64 secret is set, that secret takes precedence.
#
# Speed switches (see README in scripts/ci):
#   -PskipReleaseLint=true     skip the release "vital lint" gate
#   -PciCacheDependencies=true reuse the dependency cache instead of re-resolving
#   -PfastBuild=true           skip R8 / resource shrinking (bigger, less optimized)
# Per-task timings come from scripts/ci/task-timer.gradle and are published to
# the `ci-logs` branch together with the build log.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = APKをビルド / bootstrap-keystore = 署名鍵を初回生成"
        type: choice
        options:
          - build
          - bootstrap-keystore
        default: build
      flavors:
        description: "build only what you need"
        type: choice
        options:
          - legacy
          - modern
          - both
        default: legacy
      fast:
        description: "R8/リソース圧縮をスキップして高速化（未最適化・サイズ増）"
        type: boolean
        default: false
      publish_release:
        description: "GitHub Release にAPKを添付する"
        type: boolean
        default: true
      timings:
        description: "タスク毎の所要時間を計測（configuration cache を無効化して実行）"
        type: boolean
        default: false
      cold_build:
        description: "ベンチマーク用: --rerun-tasks でキャッシュを使わず全タスクを実行"
        type: boolean
        default: false
      pixel9a:
        description: "Pixel 9a 向け（arm64 のみ・32bit資産を除外）"
        type: boolean
        default: false
  push:
    branches: [ main ]

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  UPSTREAM_REPO: utkarshdalal/GameNative
  UPSTREAM_SHA: 449decb3a51343e3ccd4aebfda8d5caf20cc84b5

jobs:
  # ---------------------------------------------------------------------------
  # Optional one-off helper: generate a fresh keystore and expose it as an
  # artifact (useful when moving the key out of the repo and into secrets).
  # ---------------------------------------------------------------------------
  bootstrap-keystore:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap-keystore'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate release keystore
        run: |
          set -euo pipefail
          mkdir -p out
          STORE_PASS="$(openssl rand -hex 16)"
          ALIAS="nativerunner"
          keytool -genkeypair \
            -keystore out/release.jks \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10950 \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=NativeRunner Release, OU=Release, O=NativeRunner, C=JP"
          base64 -w0 out/release.jks > out/keystore.b64
          cat > out/credentials.txt <<EOF
          KEYSTORE_KEY_ALIAS=$ALIAS
          KEYSTORE_KEY_PASSWORD=$STORE_PASS
          KEYSTORE_STORE_PASSWORD=$STORE_PASS
          EOF
          keytool -list -v -keystore out/release.jks -storepass "$STORE_PASS" | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: out/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build the release-signed APKs.
  # ---------------------------------------------------------------------------
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci || sudo dd if=/dev/zero of=/mnt/swapfile.ci bs=1M count=8192
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci
          free -m

      # The app module depends on two submodules (a leveldb fork and a snappy fork); Gradle fails
      # the whole build when they are empty, so they are fetched before anything else runs.
      - name: Check out leveldb + snappy submodules
        if: steps.want.outputs.run == 'true'
        run: git submodule update --init --recursive iq80-leveldb/upstream snappy-java/upstream

      - name: Restore large binary assets (assets / jniLibs / bundletool)
        run: scripts/fetch-large-assets.sh

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Restores/saves the Gradle user home (dependency cache, transforms and
      # the local build cache), which is what makes repeat builds much faster.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install Android SDK packages (only if missing)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ -d "$SDK/platforms/android-36" ] && ls -d "$SDK"/build-tools/*/ >/dev/null 2>&1; then
            echo "SDK packages already present"
          else
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" || true
          fi
          df -h /

      - name: Configure release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app/keystores
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "using keystore from repository secrets"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystores/keystore
            {
              echo "storeFile=keystores/keystore"
              echo "storeType=PKCS12"
              echo "keyAlias=$KEYSTORE_KEY_ALIAS"
              echo "storePassword=$KEYSTORE_STORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
            } > app/keystores/keystore.properties
          else
            echo "using keystore checked in at ci/release/"
            cp ci/release/release-keystore.p12 app/keystores/keystore
            cp ci/release/keystore.properties app/keystores/keystore.properties
          fi
          ls -l app/keystores/
          sed 's/\(Password=\).*/\1***/' app/keystores/keystore.properties

      # Only non-empty values are written: the secrets-gradle-plugin turns every
      # local.properties entry into a BuildConfig field, and an empty value emits
      # `public static final String X = ;` which does not compile.
      - name: Inject optional build credentials
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          STEAMGRIDDB_API_KEY: ${{ secrets.STEAMGRIDDB_API_KEY }}
          CLOUD_PROJECT_NUMBER: ${{ secrets.CLOUD_PROJECT_NUMBER }}
        run: |
          : > local.properties
          for key in POSTHOG_API_KEY POSTHOG_HOST STEAMGRIDDB_API_KEY CLOUD_PROJECT_NUMBER; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              echo "$key=$value" >> local.properties
            fi
          done
          echo "local.properties entries: $(grep -c '=' local.properties || true)"

      - name: Build release-signed APKs
        env:
          FLAVORS: ${{ inputs.flavors || 'legacy' }}
          FAST: ${{ inputs.fast || 'false' }}
          TIMINGS: ${{ inputs.timings || 'false' }}
          COLD: ${{ inputs.cold_build || 'false' }}
          PIXEL9A: ${{ inputs.pixel9a || '' }}
        run: |
          set -euo pipefail
          TASKS=""
          case "${FLAVORS}" in
            legacy) TASKS=":app:assembleLegacyRelease-signed" ;;
            modern) TASKS=":app:assembleModernRelease-signed" ;;
            both)   TASKS=":app:assembleLegacyRelease-signed :app:assembleModernRelease-signed" ;;
            *) echo "unknown flavors input: ${FLAVORS}"; exit 1 ;;
          esac

          # Push builds target the reference device (Pixel 9a): 64-bit only, so the
          # armeabi-v7a payload is dropped and packaging stays cheap.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -z "${PIXEL9A}" ]; then
            PIXEL9A="true"
          fi

          SPEED="-PskipReleaseLint=true -PciCacheDependencies=true"
          if [ "${PIXEL9A}" = "true" ]; then
            SPEED="$SPEED -Ppixel9a=true"
            echo "Pixel 9a target: arm64-v8a only (armeabi-v7a payload dropped)"
          fi
          if [ "${FAST}" = "true" ]; then
            SPEED="$SPEED -PfastBuild=true"
            echo "fast mode: R8 / resource shrinking disabled"
          fi

          # The task-timer listeners are not configuration-cache compatible, so
          # timings runs trade the configuration cache for measurement.
          TIMER_ARGS=""
          if [ "${TIMINGS}" = "true" ]; then
            TIMER_ARGS="--init-script scripts/ci/task-timer.gradle --no-configuration-cache"
            echo "timings mode: configuration cache disabled"
          fi

          COLD_ARGS=""
          if [ "${COLD}" = "true" ]; then
            COLD_ARGS="--rerun-tasks"
            echo "cold build: --rerun-tasks (build cache not used)"
          fi

          ./gradlew --console=plain --stacktrace --build-cache \
            $TIMER_ARGS $COLD_ARGS $SPEED $TASKS 2>&1 | tee /tmp/gradle-build.log

          find app/build/outputs/apk -name '*.apk' -printf '%s %p\n' || true

      # Build logs and per-task timings are mirrored into the `ci-logs` branch
      # (artifact and log downloads redirect to hosts that automation cannot
      # always reach) and the failure reason is surfaced as a check annotation.
      - name: Publish build log
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          LOG=".ci-logs/gradle-${RUN_ID}.log"
          mkdir -p .ci-logs
          if [ -f /tmp/gradle-build.log ]; then
            {
              echo "=== per-task timings (slowest 40) ==="
              grep -P '^TIMER\t' /tmp/gradle-build.log | sort -t$'\t' -k2 -nr | head -40 || true
              echo "=== build log (tail) ==="
              tail -c 2500000 /tmp/gradle-build.log || true
            } > "$LOG"
            EXCERPT="$(awk '/What went wrong/{f=1} f' /tmp/gradle-build.log | head -40)"
            [ -z "$EXCERPT" ] && EXCERPT="$(tail -40 /tmp/gradle-build.log)"
            ESCAPED="$(printf '%s\n' "$EXCERPT" | head -c 3500 | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=gradle-log-${RUN_ID}::$ESCAPED"
          else
            echo "no gradle log captured" > "$LOG"
          fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f "$LOG"
          git commit -m "ci: gradle log for run ${RUN_ID}" || true
          if git push --force origin "HEAD:refs/heads/ci-logs" > /tmp/push.log 2>&1; then
            echo "log pushed to ci-logs"
          else
            echo "log push failed:"
            tail -5 /tmp/push.log
            echo "::warning title=ci-logs-push::$(tail -4 /tmp/push.log | tr '\n' ' ' | sed -e 's/%/%25/g' | head -c 500)"
          fi
          if [ -f /tmp/gradle-build.log ] && grep -qP '^TIMER\t' /tmp/gradle-build.log; then
            TOP="$(grep -P '^TIMER\t' /tmp/gradle-build.log | sort -t$'\t' -k2 -nr | head -15 \
              | awk -F'\t' '{printf "%.1fs  %s%%0A", $2/1000, $3}')"
            echo "::notice title=task-timings-${RUN_ID}::$TOP"
          fi

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          APKSIGNER="${BUILD_TOOLS}apksigner"
          for apk in $(find app/build/outputs/apk -name '*.apk'); do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Stage APKs
        run: |
          set -euo pipefail
          # versionName / versionCode straight from the module build file, so the artefact
          # name always matches the APK's own manifest.
          VERSION="$(grep -m1 -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts \
            | sed -E 's/.*"([^"]+)".*/\1/')"
          VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts \
            | sed -E 's/[^0-9]//g')"
          : "${VERSION:?could not read versionName from app/build.gradle.kts}"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "APK_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          mkdir -p out
          if ls app/build/outputs/apk/legacy/release-signed/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/legacy/release-signed/*.apk \
              "out/GameNative-${VERSION}-legacy-release-signed.apk"
          fi
          if ls app/build/outputs/apk/modern/release-signed/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/modern/release-signed/*.apk \
              "out/GameNative-${VERSION}-modern-release-signed.apk"
          fi
          ls -lh out/

      # A release asset is the only distribution channel: uploading the same APK
      # twice (artifact + release) wasted a chunk of the run time.
      - name: Publish APKs to a GitHub release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release create "$TAG" out/*.apk \
            --target "${{ github.sha }}" \
            --title "GameNative ${APK_VERSION} (build #${{ github.run_number }})" \
            --notes "Automated release-signed build of \`${{ github.sha }}\` — version ${APK_VERSION} (versionCode ${APK_VERSION_CODE}), flavors: ${{ inputs.flavors || 'legacy' }}.

          - 署名: ci/release のリリース鍵（自己署名）
          - 上流 GameNative とは署名が異なるため、既存インストールの上書き更新はできません
          - ビルドログ: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload APK as workflow artifact
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == false
        uses: actions/upload-artifact@v4
        with:
          name: release-signed-apk
          path: out/*.apk
          retention-days: 14

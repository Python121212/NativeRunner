name: Build Release APK

# Produces release-signed APKs (legacy + modern flavors) and attaches them to a
# GitHub release so they can be downloaded without logging in to Actions.
#
# Signing key: ci/release/release-keystore.p12 (see ci/release/README.md).
# If the KEYSTORE_BASE64 secret is set, that secret takes precedence.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = APKをビルド / bootstrap-keystore = 署名鍵を初回生成"
        type: choice
        options:
          - build
          - bootstrap-keystore
        default: build
  push:
    branches: [ main ]

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Optional one-off helper: generate a fresh keystore and expose it as an
  # artifact (useful when moving the key out of the repo and into secrets).
  # ---------------------------------------------------------------------------
  bootstrap-keystore:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'bootstrap-keystore'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate release keystore
        run: |
          set -euo pipefail
          mkdir -p out
          STORE_PASS="$(openssl rand -hex 16)"
          ALIAS="nativerunner"
          keytool -genkeypair \
            -keystore out/release.jks \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10950 \
            -storepass "$STORE_PASS" \
            -keypass "$STORE_PASS" \
            -dname "CN=NativeRunner Release, OU=Release, O=NativeRunner, C=JP"
          base64 -w0 out/release.jks > out/keystore.b64
          cat > out/credentials.txt <<EOF
          KEYSTORE_KEY_ALIAS=$ALIAS
          KEYSTORE_KEY_PASSWORD=$STORE_PASS
          KEYSTORE_STORE_PASSWORD=$STORE_PASS
          EOF
          keytool -list -v -keystore out/release.jks -storepass "$STORE_PASS" | head -30

      - uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: out/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Build the release-signed APKs.
  # ---------------------------------------------------------------------------
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile.ci || sudo dd if=/dev/zero of=/mnt/swapfile.ci bs=1M count=8192
          sudo chmod 600 /mnt/swapfile.ci
          sudo mkswap /mnt/swapfile.ci
          sudo swapon /mnt/swapfile.ci
          free -m

      - uses: actions/checkout@v4

      - name: Restore large binary assets (assets / jniLibs / bundletool)
        run: scripts/fetch-large-assets.sh

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" || true
          df -h /

      - name: Configure release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app/keystores
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "using keystore from repository secrets"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/keystores/keystore
            {
              echo "storeFile=keystores/keystore"
              echo "storeType=PKCS12"
              echo "keyAlias=$KEYSTORE_KEY_ALIAS"
              echo "storePassword=$KEYSTORE_STORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
            } > app/keystores/keystore.properties
          else
            echo "using keystore checked in at ci/release/"
            cp ci/release/release-keystore.p12 app/keystores/keystore
            cp ci/release/keystore.properties app/keystores/keystore.properties
          fi
          ls -l app/keystores/
          cat app/keystores/keystore.properties | sed 's/\(Password=\).*/\1***/'

      - name: Inject optional build credentials
        run: |
          cat > local.properties <<EOF
          POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
          STEAMGRIDDB_API_KEY=${{ secrets.STEAMGRIDDB_API_KEY }}
          CLOUD_PROJECT_NUMBER=${{ secrets.CLOUD_PROJECT_NUMBER }}
          EOF

      - name: Build release-signed APKs
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace -Pkotlin.daemon.jvmargs=-Xmx4g \
            :app:assembleLegacyRelease-signed \
            :app:assembleModernRelease-signed 2>&1 | tee /tmp/gradle-build.log
          ./gradlew --stop || true
          find app/build/outputs/apk -name '*.apk' -printf '%s %p\n'

      # The build log is pushed to the `ci-logs` branch so it can be inspected
      # with plain `git fetch` (artifact/log downloads are not always reachable).
      - name: Publish build log to ci-logs branch
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p .ci-logs
          if [ -f /tmp/gradle-build.log ]; then
            tail -c 3000000 /tmp/gradle-build.log > ".ci-logs/gradle-${RUN_ID}.log" || true
          else
            echo "no gradle log captured" > ".ci-logs/gradle-${RUN_ID}.log"
          fi
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ".ci-logs/gradle-${RUN_ID}.log"
          git commit -m "ci: gradle log for run ${RUN_ID} [${{ job.status }}]" || true
          git push --force origin "HEAD:refs/heads/ci-logs" || echo "log push failed"

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/ 2>/dev/null | sort -V | tail -1)"
          APKSIGNER="${BUILD_TOOLS}apksigner"
          echo "using $APKSIGNER"
          for apk in $(find app/build/outputs/apk -name '*.apk'); do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Stage APKs
        run: |
          set -euo pipefail
          mkdir -p out
          cp app/build/outputs/apk/legacy/release-signed/*.apk "out/GameNative-legacy-release-signed.apk"
          cp app/build/outputs/apk/modern/release-signed/*.apk "out/GameNative-modern-release-signed.apk"
          ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: release-signed-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish APKs to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: apk-${{ github.run_number }}
        run: |
          set -euo pipefail
          gh release create "$TAG" out/*.apk \
            --target "${{ github.sha }}" \
            --title "Release APK #${{ github.run_number }}" \
            --notes "Automated release-signed build of \`${{ github.sha }}\`.

          - 署名: ci/release のリリース鍵（自己署名）
          - 上流 GameNative とは署名が異なるため、既存インストールの上書き更新はできません
          - ビルドログ: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
